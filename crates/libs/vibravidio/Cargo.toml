[package]
name = "vibravidio"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true

[features]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
# -- Core
vibravidio-core = { path = "../../libs/vibravidio-core" }
vibravidio-thread = { path = "../../libs/vibravidio-thread" }
vibravidio-ringbuffer = { path = "../../libs/vibravidio-ringbuffer" }

# -- Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# -- Others
derive_more = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
vibravidio-camera-v4l2 = { path = "../../libs/vibravidio-camera-v4l2" }
vibravidio-screen-x11 = { path = "../../libs/vibravidio-screen-x11" }
vibravidio-screen-wayland = { path = "../../libs/vibravidio-screen-wayland" }

[target.'cfg(target_os = "windows")'.dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { workspace = true, optional = true, features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
anyhow = { workspace = true }

[build-dependencies]
