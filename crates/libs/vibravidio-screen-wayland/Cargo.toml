ashpd = { version = "0.14", features = ["screencast"] }
pipewire = "0.10.1"
tokio = { workspace = true, features = ["rt-multi-thread"] }
# -- Others
derive_more = { workspace = true }
bytes = "1.12.1"

[dev-dependencies]
anyhow = { workspace = true }
